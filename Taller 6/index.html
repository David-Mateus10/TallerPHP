<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comprobador de Divisibilidad</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Comprobador de Divisibilidad</h1>
        </header>

        <main>
            <form method="post" action="operaciones.php">
                <div class="form-group">
                    <label for="a">Ingrese el número A:</label>
                    <input type="text" name="a" id="a" placeholder="Ej: 18" required>
                </div>

                <div class="form-group">
                    <label for="b">Ingrese el número B:</label>
                    <input type="text" name="b" id="b" placeholder="Ej: 5" required>
                </div>

                <div class="acciones">
                    <button type="submit" class="boton">Verificar</button>
                    <button type="reset" class="boton secundario">Limpiar</button>
                </div>
            </form>
        </main>

        <footer>
            <div class="links">
                <a href="../index.html">← Volver a la lista de talleres</a>
            </div>
        </footer>
    </div>
</body>
</html>
