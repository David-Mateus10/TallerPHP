<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Calculadora de Fibonacci o Factorial</title>
    <link rel="stylesheet" href="estilos.css">
</head>

<body>
    <main>
        <h1>Calculadora de Fibonacci o Factorial</h1>

        <form method="post" action="operaciones.php">

            <div class="form-group">
                <label for="numero">Ingrese un número entero positivo:</label><br>
                <input type="number" name="numero" id="numero" min="0" required>
            </div>

            <div class="form-group">
                <p>Seleccione una operación:</p>
                <div class="opcion">
                    <input type="radio" name="operacion" id="fibonacci" value="fibonacci" required>
                    <label for="fibonacci">Sucesión de Fibonacci</label>
                </div>
                <div class="opcion">
                    <input type="radio" name="operacion" id="factorial" value="factorial">
                    <label for="factorial">Factorial</label>
                </div>
            </div>

            <div class="form-buttons">
                <input type="submit" value="Calcular">
                <input type="reset" value="Limpiar">
            </div>

        </form>
    </main>
    <footer>
        <div class="links">
            <a href="../">⬅ Volver a la lista de talleres</a>
        </div>
    </footer>
</body>

</html>
