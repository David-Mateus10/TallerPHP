<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Fibonacci y Factorial</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Calculadora de Fibonacci o Factorial</h1>

    <form method="post" action="procesar.php">
        <label for="numero">Ingrese un número entero positivo:</label><br>
        <input type="number" name="numero" id="numero" min="0" required>

        <br><br>

        <label>Seleccione una operación:</label><br>
        <input type="radio" name="operacion" value="fibonacci" required> Sucesión de Fibonacci<br>
        <input type="radio" name="operacion" value="factorial"> Factorial

        <br><br>

        <input type="submit" value="Calcular">
    </form>
</body>
</html>
